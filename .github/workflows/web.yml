# Build e publicação automática no GitHub Pages.
#
#   main -> versão ATIVA  (https://<usuario>.github.io/arena-pixel/)
#   dev  -> versão TESTE  (https://<usuario>.github.io/arena-pixel/teste/)
#
# A cada push em main ou dev, os dois ramos são testados e exportados.
# Se qualquer teste falhar, nada é publicado e o site continua como estava.
name: Build Web

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.5.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar versão ativa (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: ramo-main

      - name: Baixar versão de teste (dev)
        id: dev
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: dev
          path: ramo-dev

      - name: Cache do Godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web

      - name: Instalar Godot e modelos de exportação Web
        run: |
          if [ ! -x ~/godot/godot ]; then
            URL=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
            mkdir -p ~/godot && cd ~/godot
            wget -q $URL/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
            unzip -q Godot_v*.zip && mv Godot_v*_linux.x86_64 godot && rm -f *.zip
            wget -q $URL/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
            unzip -q *.tpz
            DEST=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
            mkdir -p $DEST && mv templates/web_* templates/version.txt $DEST/
            rm -rf templates *.tpz
          fi

      - name: Testar e exportar
        run: |
          set -eo pipefail
          exportar() {  # $1 = pasta do projeto, $2 = pasta de saída, $3 = "teste" na build de teste
            echo "::group::$1"
            cd "$GITHUB_WORKSPACE/$1"
            ~/godot/godot --headless --import --path . || true
            # Reprova se o teste falhar OU se aparecer qualquer erro de script
            ~/godot/godot --headless --fixed-fps 60 --path . -s tools/teste.gd 2>&1 | tee teste.log
            if grep -q "SCRIPT ERROR" teste.log; then echo "::error::Erro de script no teste"; exit 1; fi
            # Jogo em rede: duas instâncias conectadas (anfitrião + convidado)
            if [ -f tools/teste_rede.gd ]; then
              PAPEL=anfitriao timeout 90 ~/godot/godot --headless --path . -s tools/teste_rede.gd > rede_anf.log 2>&1 &
              sleep 1
              PAPEL=convidado timeout 90 ~/godot/godot --headless --path . -s tools/teste_rede.gd > rede_conv.log 2>&1 || true
              wait
              cat rede_anf.log rede_conv.log | grep -E "REDE|FALHOU|SCRIPT ERROR" || true
              if [ "$(grep -c '^REDE OK' rede_anf.log rede_conv.log | awk -F: '{s+=$2} END {print s}')" != "2" ] \
                  || grep -q "SCRIPT ERROR" rede_anf.log rede_conv.log; then
                echo "::error::Teste de rede falhou"; exit 1
              fi
            fi
            # Build de teste: a versão mostrada no menu ganha "-teste" e o commit
            if [ "$3" = "teste" ]; then
              COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "?")
              sed -i -E "s/^config\/version=\"([^\"]*)\"/config\/version=\"\1-teste · $COMMIT\"/" project.godot
              grep "^config/version" project.godot
            fi
            mkdir -p "$2"
            ~/godot/godot --headless --path . --export-release "Web" "$2/index.html"
            test -f "$2/index.wasm"
            echo "::endgroup::"
          }
          exportar ramo-main "$GITHUB_WORKSPACE/site"
          if [ -d "$GITHUB_WORKSPACE/ramo-dev" ]; then
            exportar ramo-dev "$GITHUB_WORKSPACE/site/teste" teste
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # Ao publicar a main: cria a tag v<versão> e o Release com as notas de
  # NOVIDADES.md (seção "## v<versão>"), se essa versão ainda não tiver tag.
  versao:
    needs: publicar
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Criar tag e Release da versão
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSAO=$(sed -n -E 's/^config\/version="([^"]*)"/\1/p' project.godot)
          if [ -z "$VERSAO" ]; then echo "::warning::Sem config/version no project.godot"; exit 0; fi
          TAG="v$VERSAO"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "A tag $TAG já existe; nada a fazer."; exit 0
          fi
          # Notas: o trecho de NOVIDADES.md entre "## v<versão>" e o próximo "## "
          awk -v t="## $TAG" '$0 == t {achou=1; next} achou && /^## / {exit} achou {print}' NOVIDADES.md > notas.md 2>/dev/null || true
          if [ ! -s notas.md ]; then echo "Versão $TAG." > notas.md; fi
          cat notas.md
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Arena Pixel $TAG" --notes-file notas.md
